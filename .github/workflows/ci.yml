name: Validate game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:vercel
      - run: npm run build:vercel
      - run: npm run build
      - name: Validate database migrations in deployment archive
        run: |
          tar -czf /tmp/bloom-deployment.tar.gz dist
          node scripts/verify-deployment-archive.mjs /tmp/bloom-deployment.tar.gz
      - run: npm run db:local
      - name: Start local Worker and verify score storage
        run: |
          npm start > /tmp/bloom-worker.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/scores; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8787 npm run test:api
